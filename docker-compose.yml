services:
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    restart: unless-stopped
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data: